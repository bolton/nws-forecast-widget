<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>nws-forecast-widget demo</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
			}
			body {
				margin: 0 auto;
				max-width: 860px;
				padding: 24px 16px 64px;
				line-height: 1.5;
			}
			form {
				display: flex;
				flex-wrap: wrap;
				gap: 8px 12px;
				align-items: end;
				margin: 16px 0 20px;
			}
			label {
				display: grid;
				font-size: 0.8rem;
				gap: 2px;
			}
			input,
			select,
			button {
				font: inherit;
				padding: 6px 8px;
			}
			input {
				width: 9em;
			}
			.presets {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
				margin-top: -8px;
			}
			pre {
				overflow-x: auto;
				padding: 12px;
				border-radius: 8px;
				background: color-mix(in srgb, CanvasText 7%, transparent);
				font-size: 0.85rem;
			}
			.themed {
				--nws-bg: #0f172a;
				--nws-fg: #e2e8f0;
				--nws-accent: #38bdf8;
				--nws-border: #1e293b;
				--nws-radius: 4px;
				--nws-font: Georgia, serif;
			}
			.narrow {
				max-width: 320px;
			}
		</style>
		<script type="module" src="../src/index.js"></script>
	</head>
	<body>
		<h1>nws-forecast-widget</h1>
		<p>
			A National Weather Service forecast for any US latitude and longitude. One script tag, no API
			key.
		</p>

		<form id="controls">
			<label>Latitude <input name="lat" value="47.6062" inputmode="decimal" /></label>
			<label>Longitude <input name="lng" value="-122.3321" inputmode="decimal" /></label>
			<label
				>Days
				<select name="days">
					<option>3</option>
					<option selected>5</option>
					<option>7</option>
				</select>
			</label>
			<label
				>Units
				<select name="units">
					<option value="us">°F</option>
					<option value="si">°C</option>
				</select>
			</label>
			<button>Show forecast</button>
		</form>
		<div class="presets">
			<button data-lat="47.6062" data-lng="-122.3321">Seattle</button>
			<button data-lat="46.8523" data-lng="-121.7603">Mount Rainier</button>
			<button data-lat="39.7392" data-lng="-104.9903">Denver</button>
			<button data-lat="25.7617" data-lng="-80.1918">Miami</button>
			<button data-lat="51.5072" data-lng="-0.1276">London (outside coverage)</button>
		</div>

		<h2>Live</h2>
		<nws-forecast id="live" lat="47.6062" lng="-122.3321" days="5"></nws-forecast>
		<pre id="snippet"></pre>

		<h2>Themed with CSS custom properties</h2>
		<nws-forecast
			class="themed"
			lat="47.5301"
			lng="-121.4141"
			days="4"
			heading="Snoqualmie Pass"
		></nws-forecast>

		<h2>Narrow container</h2>
		<div class="narrow">
			<nws-forecast lat="47.5962" lng="-120.6615" days="4" no-attribution></nws-forecast>
		</div>

		<script type="module">
			const live = document.getElementById('live');
			const form = document.getElementById('controls');
			const snippet = document.getElementById('snippet');

			function apply() {
				const data = new FormData(form);
				for (const name of ['lat', 'lng', 'days', 'units']) live.setAttribute(name, data.get(name));
				const units = data.get('units') === 'si' ? ' units="si"' : '';
				snippet.textContent =
					`<script type="module" src="https://cdn.jsdelivr.net/npm/nws-forecast-widget@0.1.1/src/index.js"><\/script>\n` +
					`<nws-forecast lat="${data.get('lat')}" lng="${data.get('lng')}" days="${data.get('days')}"${units}></nws-forecast>`;
			}

			form.addEventListener('submit', (event) => {
				event.preventDefault();
				apply();
			});
			document.querySelectorAll('.presets button').forEach((button) =>
				button.addEventListener('click', () => {
					form.lat.value = button.dataset.lat;
					form.lng.value = button.dataset.lng;
					apply();
				})
			);
			apply();
		</script>
	</body>
</html>
